# DeepSeek Harness bundle layer for the MCP sentinel plugin.
#
# Applied as one insert over the profile root. The plugin takes no config:
# sentinel behavior is driven by environment variables and the MCP servers the
# profile already bridged with @deepseek-ai/dsh-mcp-client.
- insert:
    - id: mcp-sentinel
      name: "@gcszhn/mcp-sentinel-deepseek-harness-plugin"
