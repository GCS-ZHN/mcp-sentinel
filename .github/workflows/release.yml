name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Verify version matches tag
        run: |
          PKG_VER="v$(node -e "console.log(require('./package.json').version)")"
          TAG="${{ github.ref_name }}"
          if [ "$PKG_VER" != "$TAG" ]; then
            echo "Package version $PKG_VER != tag $TAG"
            exit 1
          fi
      - run: bun publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
