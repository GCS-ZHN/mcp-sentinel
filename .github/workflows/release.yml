name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test

      - name: Verify versions match tag (lockstep)
        run: |
          TAG="${{ github.ref_name }}"
          for pkg in packages/core packages/opencode packages/deepseek-harness packages/cli; do
            PKG_VER="v$(node -e "console.log(require('./$pkg/package.json').version)")"
            if [ "$PKG_VER" != "$TAG" ]; then
              echo "$pkg version $PKG_VER != tag $TAG"
              exit 1
            fi
          done
          CORE_VER="$(node -e "console.log(require('./packages/core/package.json').version)")"
          for plugin in packages/opencode packages/deepseek-harness packages/cli; do
            PLUGIN_CORE_DEP="$(node -e "console.log(require('./$plugin/package.json').dependencies['@gcszhn/mcp-sentinel-core'])")"
            if [ "$PLUGIN_CORE_DEP" != "$CORE_VER" ]; then
              echo "$plugin depends on @gcszhn/mcp-sentinel-core@$PLUGIN_CORE_DEP, expected $CORE_VER"
              exit 1
            fi
          done

      - name: Publish @gcszhn/mcp-sentinel-core
        run: npm publish --provenance --access public
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The core must be published first (plugins pin its exact version).
      # Plugin publishes are independent of each other, so they run in
      # parallel via background jobs and `wait`.
      - name: Publish plugins (opencode + deepseek-harness + cli, in parallel)
        run: |
          (cd packages/opencode && npm publish --provenance --access public) & P1=$!
          (cd packages/deepseek-harness && npm publish --provenance --access public) & P2=$!
          (cd packages/cli && npm publish --provenance --access public) & P3=$!
          FAIL=0
          wait "$P1" || FAIL=1
          wait "$P2" || FAIL=1
          wait "$P3" || FAIL=1
          exit "$FAIL"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline --no-merges)
          else
            CHANGELOG=$(git log --oneline --no-merges "${PREV_TAG}..HEAD")
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes

            ```
            ${{ steps.changelog.outputs.changelog }}
            ```
          generate_release_notes: true
